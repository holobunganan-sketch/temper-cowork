name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temper 运行时隔离:CI 绝不触碰真实用户数据(路径位于 runner 的 checkout 工作区内)
  REASONIX_HOME: ${{ github.workspace }}/.ci/reasonix-home
  REASONIX_STATE_HOME: ${{ github.workspace }}/.ci/reasonix-state
  REASONIX_CACHE_HOME: ${{ github.workspace }}/.ci/reasonix-cache
  REASONIX_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=10m

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test (terminal)
        run: pnpm test:terminal

      - name: test (task monitor)
        run: pnpm test:task-monitor

      - name: test (workspace)
        run: pnpm test:workspace

      - name: test (usage stats)
        run: pnpm test:usage-stats

      - name: test (settings responsive)
        run: pnpm test:settings-responsive

      - name: test (transcript)
        run: pnpm test:transcript

      - name: test (motion)
        run: pnpm test:motion

      - name: test (composer menu)
        run: pnpm test:composer-menu-viewport

      - name: test (remote)
        run: pnpm test:remote

      - name: build
        run: pnpm build

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        id: wails-install
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          set +e
          ok=0
          for i in 1 2 3; do
            echo "=== wails install attempt $i ==="
            go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat "$GITHUB_WORKSPACE/.wails-version")" 2>&1 | tee /tmp/wails-install.log
            code=${PIPESTATUS[0]}
            echo "attempt $i exit=$code"
            echo "go version: $(go version) | GOOS=$(go env GOOS) GOARCH=$(go env GOARCH) GOPROXY=$(go env GOPROXY) GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
            if [ $code -eq 0 ]; then ok=1; break; fi
            sleep 10
          done
          if [ $ok -ne 1 ]; then exit 1; fi

      - name: Report wails install failure
        if: failure() && steps.wails-install.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Wails install failed (run ${{ github.run_id }})"
            echo '```'
            cat /tmp/wails-install.log 2>/dev/null | tail -60
            echo '```'
          } > /tmp/wails-issue.md
          gh issue create --repo "${{ github.repository }}" \
            --title "CI: wails install failed (run ${{ github.run_id }})" \
            --body-file /tmp/wails-issue.md 2>&1 || echo "issue creation failed"
          exit 0

      - name: Desktop short tests
        run: go test -short -count=1 -timeout=15m .

      - name: Frontend install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Wails build
        run: wails build

      - name: Verify artifact
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\desktop\build\bin" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No exe produced by wails build" }
          Write-Output "Built: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
