name: Release MSIX

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  REASONIX_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  release-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          set +e
          ok=0
          for i in 1 2 3; do
            go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat "$GITHUB_WORKSPACE/.wails-version")" && { ok=1; break; }
            echo "wails install attempt $i failed, retrying..."
            sleep 10
          done
          if [ $ok -ne 1 ]; then exit 1; fi

      - name: Frontend install + build
        shell: bash
        run: |
          pnpm --dir desktop/frontend install --frozen-lockfile
          pnpm --dir desktop/frontend build

      - name: Wails build (Temper.exe)
        shell: bash
        run: |
          cd desktop
          wails build

      - name: Defender raw EXE scan
        shell: powershell
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\desktop\build\bin" -Filter "Temper.exe" | Select-Object -First 1
          if (-not $exe) { throw "Temper.exe not found" }
          & "$env:GITHUB_WORKSPACE\scripts\defender-scan.ps1" -Path $exe.FullName

      - name: MakeAppx pack (unsigned MSIX)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\msix\Build-MSIX.ps1" -Version "0.3.0.0"

      - name: Decode signing PFX from secrets
        shell: powershell
        env:
          PFX_B64: ${{ secrets.TEMPER_MSIX_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.TEMPER_MSIX_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { throw "TEMPER_MSIX_PFX_B64 secret is not configured" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "temper-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          Write-Output "PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          Write-Output "PFX_PW=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\msix\Sign-MSIX.ps1" `
            -Msix "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0.0-windows-x64-unsigned.msix" `
            -PfxPath "$env:PFX_PATH" -PfxPassword "$env:PFX_PW"

      - name: Verify MSIX signature
        shell: powershell
        run: |
          # windows-latest 服务账户可写 LocalMachine\Root;信任开发证书后 verify /pa
          Import-Certificate -FilePath "$env:GITHUB_WORKSPACE\packaging\msix\Temper-Development.cer" `
            -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          & "$env:GITHUB_WORKSPACE\scripts\msix\Verify-MSIX.ps1" `
            -Msix "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0.0-windows-x64.msix"

      - name: Defender signed MSIX scan
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\defender-scan.ps1" `
            -Path "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0.0-windows-x64.msix"

      - name: Generate SHA256SUMS
        shell: powershell
        run: |
          $msix = Get-FileHash -Algorithm SHA256 "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0.0-windows-x64.msix"
          $cer = Get-FileHash -Algorithm SHA256 "$env:GITHUB_WORKSPACE\packaging\msix\Temper-Development.cer"
          "SHA256 (Temper-0.3.0-windows-x64.msix) = $($msix.Hash)" | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0-SHA256SUMS.txt"
          "SHA256 (Temper-Development.cer) = $($cer.Hash)" | Out-File -Append -Encoding ascii "$env:GITHUB_WORKSPACE\dist\Temper-0.3.0-SHA256SUMS.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\packaging\msix\Temper-Development.cer" "$env:GITHUB_WORKSPACE\dist\"
          Copy-Item "$env:GITHUB_WORKSPACE\packaging\msix\INSTALL-MSIX.md" "$env:GITHUB_WORKSPACE\dist\"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Temper ${{ github.ref_name }}
          body: |
            ## Temper ${{ github.ref_name }}

            **Shape intent. Ship work.**

            ### Assets
            - Temper-0.3.0-windows-x64.msix(签名 MSIX)
            - Temper-Development.cer(开发证书公钥)
            - Temper-0.3.0-SHA256SUMS.txt(校验和)
            - INSTALL-MSIX.md(安装说明)
          files: |
            dist/Temper-0.3.0-windows-x64.msix
            dist/Temper-Development.cer
            dist/Temper-0.3.0-SHA256SUMS.txt
            dist/INSTALL-MSIX.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') }}
