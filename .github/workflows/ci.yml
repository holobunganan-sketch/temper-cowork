name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temper 运行时隔离:CI 绝不触碰真实用户数据(路径位于 runner 的 checkout 工作区内)
  REASONIX_HOME: ${{ github.workspace }}/.ci/reasonix-home
  REASONIX_STATE_HOME: ${{ github.workspace }}/.ci/reasonix-state
  REASONIX_CACHE_HOME: ${{ github.workspace }}/.ci/reasonix-cache
  REASONIX_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=10m

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test (terminal)
        run: pnpm test:terminal

      - name: test (task monitor)
        run: pnpm test:task-monitor

      - name: test (workspace)
        run: pnpm test:workspace

      - name: test (usage stats)
        run: pnpm test:usage-stats

      - name: test (settings responsive)
        run: pnpm test:settings-responsive

      - name: test (transcript)
        run: pnpm test:transcript

      - name: test (motion)
        run: pnpm test:motion

      - name: test (composer menu)
        run: pnpm test:composer-menu-viewport

      - name: test (remote)
        run: pnpm test:remote

      - name: build
        run: pnpm build

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          set +e
          ok=0
          for i in 1 2 3; do
            go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat "$GITHUB_WORKSPACE/.wails-version")" && { ok=1; break; }
            echo "wails install attempt $i failed, retrying..."
            sleep 10
          done
          if [ $ok -ne 1 ]; then exit 1; fi

      - name: Frontend install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend build
        run: pnpm --dir frontend build

      - name: Desktop short tests
        id: desktop-tests
        shell: bash
        run: |
          set +e
          go test -short -count=1 -timeout=15m . 2>&1 | tee /tmp/desktop-tests.log
          code=${PIPESTATUS[0]}
          echo "desktop tests exit=$code"
          exit $code

      - name: Report desktop test failure
        if: failure() && steps.desktop-tests.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^--- FAIL|^FAIL|panic:|error:/ {print NR": "$0}' /tmp/desktop-tests.log | head -60 > /tmp/fail-lines.txt
          {
            echo "## Desktop tests failed (run ${{ github.run_id }})"
            echo '```'
            cat /tmp/fail-lines.txt 2>/dev/null
            echo '--- tail ---'
            tail -100 /tmp/desktop-tests.log 2>/dev/null
            echo '```'
          } > /tmp/issue-body.md
          jq -n --rawfile b /tmp/issue-body.md \
            --arg t "CI: desktop tests failed (run ${{ github.run_id }})" \
            '{title: $t, body: $b}' > /tmp/issue-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            --data-binary @/tmp/issue-payload.json || echo "issue creation failed"
          exit 0

      - name: Wails build
        run: wails build

      - name: Verify artifact
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\desktop\build\bin" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No exe produced by wails build" }
          Write-Output "Built: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
